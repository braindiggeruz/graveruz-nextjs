name: gptbot-cloudflare-credential-probe-20260831

on:
  push:
    branches:
      - ops/gptbot-cloudflare-credential-probe-20260831
    paths:
      - .github/workflows/gptbot-cloudflare-credential-probe-20260831.yml

permissions:
  contents: write

jobs:
  names-only:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
      CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/gptbot-cloudflare-credential-probe-20260831
      - name: Report names only
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_TOKEN CF_ACCOUNT_ID CLOUDFLARE_DEPLOY_HOOK CLOUDFLARE_PAGES_DEPLOY_HOOK; do
            if [ -n "${!name:-}" ]; then echo "PRESENT:$name"; else echo "MISSING:$name"; fi
          done
      - name: Remove probe
        if: always()
        run: |
          git config user.name "GPTBot Release CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/gptbot-cloudflare-credential-probe-20260831.yml
          git commit -m "chore: remove temporary credential probe"
          git push origin HEAD:ops/gptbot-cloudflare-credential-probe-20260831
