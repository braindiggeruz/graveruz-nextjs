processSteps:
  - step: '1'
    titleRu: Заявка
    titleUz: Ariza
    descriptionRu: >-
      Напишите в Telegram или заполните форму расчёта. Отправьте логотип, фото
      изделия, опишите задачу и тираж.
    descriptionUz: >-
      Telegramga yozing yoki hisob formasini to'ldiring. Logotip, mahsulot
      fotosini yuboring, vazifa va tirajni tasvirlab bering.
  - step: '2'
    titleRu: Макет
    titleUz: Maket
    descriptionRu: >-
      Создаём цифровой макет с точным размещением и размерами. Вы видите
      финальный результат до производства.
    descriptionUz: >-
      Aniq joylashish va o'lchamlar bilan raqamli maket yaratamiz. Ishlab
      chiqarishdan oldin yakuniy natijani ko'rasiz.
  - step: '3'
    titleRu: Утверждение
    titleUz: Tasdiqlash
    descriptionRu: >-
      Согласовываете макет, вносите правки при необходимости. Фиксируем сроки и
      стоимость.
    descriptionUz: >-
      Maketni kelishtirasiz, kerak bo'lsa tuzatishlar kiritasiz. Muddatlar va
      narxni belgilaymiz.
  - step: '4'
    titleRu: Производство
    titleUz: Ishlab chiqarish
    descriptionRu: >-
      Выполняем гравировку согласно утверждённому макету. Контроль качества на
      каждом этапе.
    descriptionUz: >-
      Tasdiqlangan maketga muvofiq gravyura qilamiz. Har bir bosqichda sifat
      nazorati.
faq:
  - questionRu: Какой минимальный тираж для корпоративного заказа?
    questionUz: Korporativ buyurtma uchun minimal tiraj qancha?
    answerRu: >-
      Минимального тиража нет. Делаем как 1 эксклюзивный подарок, так и серии на
      тысячи единиц. Цена за единицу снижается при объёмах от 50+ штук.
    answerUz: >-
      Minimal tiraj yo'q. 1 ta eksklyuziv sovg'adan minglab donagacha
      tayyorlaymiz. 50+ donadan narx pasayadi.
  - questionRu: Можно ли сделать персонализацию для каждого сотрудника?
    questionUz: Har bir xodim uchun personalizatsiya qilish mumkinmi?
    answerRu: >-
      Да, делаем индивидуальную гравировку имени, должности, даты для каждого
      изделия в тираже. Пришлите список — подготовим макеты для согласования.
    answerUz: >-
      Ha, tirajdagi har bir mahsulot uchun individual ism, lavozim, sana
      gravyura qilamiz. Ro'yxat yuboring — tasdiqlash uchun maketlar
      tayyorlaymiz.
  - questionRu: Работаете ли с юридическими лицами?
    questionUz: Yuridik shaxslar bilan ishlaysizmi?
    answerRu: >-
      Да, работаем с юрлицами. Предоставляем все закрывающие документы, счета,
      акты. По согласованию возможна отсрочка платежа для постоянных клиентов.
    answerUz: >-
      Ha, yuridik shaxslar bilan ishlaymiz. Barcha yopuvchi hujjatlar,
      hisob-fakturalar, dalolatnomalar taqdim etamiz. Doimiy mijozlar uchun
      to'lovni kechiktirish mumkin.
  - questionRu: Сколько времени занимает производство?
    questionUz: Ishlab chiqarish qancha vaqt oladi?
    answerRu: >-
      Типовые заказы — 1-3 дня после утверждения макета. Крупные тиражи и
      сложные проекты — обсуждаем индивидуально. Срочное производство — по
      запросу.
    answerUz: >-
      Oddiy buyurtmalar — maketni tasdiqlagandan keyin 1-3 kun. Katta tirajlar
      va murakkab loyihalar — individual muhokasa qilinadi. Shoshilinch ishlab
      chiqarish — so'rov bo'yicha.
  - questionRu: Что нужно от нас для начала работы?
    questionUz: Ishni boshlash uchun bizdan nima kerak?
    answerRu: >-
      Логотип в векторе (AI/SVG/PDF) или качественное фото. Описание: что
      наносим, на какие предметы, тираж, к какому сроку. Если нет готового
      макета — создадим сами.
    answerUz: >-
      Vektor formatida logotip (AI/SVG/PDF) yoki sifatli foto. Tavsif: nima
      qo'yiladi, qaysi buyumlarga, tiraj, qachongacha. Tayyor maket bo'lmasa —
      o'zimiz yaratamiz.
  - questionRu: На каких материалах делаете гравировку?
    questionUz: Qaysi materiallarda gravyura qilasiz?
    answerRu: >-
      Металл (сталь, алюминий, латунь), анодированный алюминий, дерево, кожа,
      стекло, акрил, премиальные пластики. Fiber, CO2, MOPA и UV-технологии.
    answerUz: >-
      Metall (po'lat, alyuminiy, latun), anodlangan alyuminiy, yog'och, charm,
      shisha, akril, premium plastmassalar. Fiber, CO2, MOPA va UV
      texnologiyalari.
  - questionRu: Можно ли увидеть результат до производства?
    questionUz: Ishlab chiqarishdan oldin natijani ko'rish mumkinmi?
    answerRu: >-
      Обязательно. Это наш стандарт работы: вы получаете цифровой макет с
      точными размерами и размещением, утверждаете его, и только потом мы
      запускаем производство.
    answerUz: >-
      Albatta. Bu bizning standart ishimiz: aniq o'lchamlar va joylashuvga ega
      raqamli maket olasiz, uni tasdiqlaysiz, va faqat shundan keyin ishlab
      chiqarishni boshlaymiz.
  - questionRu: Предоставляете ли подарочную упаковку?
    questionUz: Sovg'a qadoqlash taqdim etasizmi?
    answerRu: >-
      Да, предлагаем премиальную упаковку под ключ: коробки, пакеты, ленты,
      открытки — всё под ваш корпоративный стиль.
    answerUz: >-
      Ha, tayyor premium qadoqlash taklif qilamiz: qutichalar, paketlar,
      lentalar, ochiq xatlar — hammasi sizning korporativ uslubingizga mos.
