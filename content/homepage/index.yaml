processSteps:
  - step: '1'
    titleRu: Заявка
    titleUz: Ariza
    descriptionRu: >-
      Вы рассказываете, кому нужен подарок, какой тираж, повод, бюджет и что
      нужно нанести.
    descriptionUz: >-
      Sovg‘a kim uchun kerakligini, tiraj, sabab, byudjet va nima tushirish
      kerakligini aytasiz.
  - step: '2'
    titleRu: Макет
    titleUz: Maket
    descriptionRu: >-
      Готовим макет с логотипом, именем, датой или надписью и показываем, как
      всё будет выглядеть на изделии.
    descriptionUz: >-
      Logo, ism, sana yoki yozuv bilan maket tayyorlaymiz va buyumda qanday
      ko‘rinishini ko‘rsatamiz.
  - step: '3'
    titleRu: Утверждение
    titleUz: Tasdiqlash
    descriptionRu: >-
      Вы согласовываете расположение, текст, размер нанесения и финальный вид
      перед запуском.
    descriptionUz: >-
      Ish boshlanishidan oldin joylashuv, matn, o‘lcham va yakuniy ko‘rinishni
      tasdiqlaysiz.
  - step: '4'
    titleRu: Производство
    titleUz: Tayyorlash
    descriptionRu: >-
      После согласования выполняем гравировку, брендирование, упаковку и готовим
      заказ к выдаче или доставке.
    descriptionUz: >-
      Kelishuvdan so‘ng gravyura, brendlash, qadoqlash va buyurtmani topshirish
      yoki yetkazishga tayyorlaymiz.
faq:
  - questionRu: Какие подарки можно заказать в Graver Studio?
    questionUz: Graver Studio’da qanday sovg‘alar buyurtma qilish mumkin?
    answerRu: >-
      Можно заказать корпоративные подарки, welcome pack, VIP-наборы, сувениры с
      логотипом, подарки сотрудникам, партнёрам, клиентам и руководителям.
    answerUz: >-
      Korporativ sovg‘alar, welcome pack, VIP-to‘plamlar, logotipli suvenirlar,
      xodimlar, hamkorlar, mijozlar va rahbarlar uchun sovg‘alar buyurtma qilish
      mumkin.
  - questionRu: Можно ли сделать персонализацию для каждого сотрудника?
    questionUz: Har bir xodim uchun personalizatsiya qilish mumkinmi?
    answerRu: >-
      Да. Можно нанести имя, инициалы, дату, короткую фразу или другой
      персональный элемент на каждое изделие.
    answerUz: >-
      Ha. Har bir buyumga ism, initsial, sana, qisqa yozuv yoki boshqa shaxsiy
      element tushirish mumkin.
  - questionRu: Работаете ли с юридическими лицами?
    questionUz: Yuridik shaxslar bilan ishlaysizmi?
    answerRu: >-
      Да. Мы работаем с B2B-заказами для компаний, HR-отделов, маркетинга,
      руководителей, закупки и организаторов мероприятий.
    answerUz: >-
      Ha. Kompaniyalar, HR, marketing, rahbarlar, xarid bo‘limlari va tadbir
      tashkilotchilari uchun B2B-buyurtmalar bilan ishlaymiz.
  - questionRu: Сколько времени занимает производство?
    questionUz: Ishlab chiqarish qancha vaqt oladi?
    answerRu: >-
      Срок зависит от тиража, изделия, сложности макета и вида персонализации.
      После заявки мы уточняем детали и называем реалистичный срок выполнения.
    answerUz: >-
      Muddat tiraj, buyum turi, maket murakkabligi va personalizatsiya usuliga
      bog‘liq. Arizadan keyin tafsilotlarni aniqlab, real muddatni aytamiz.
  - questionRu: Что нужно от нас для начала работы?
    questionUz: Ishni boshlash uchun bizdan nima kerak?
    answerRu: >-
      Нужны примерный тираж, повод, бюджет, пожелания по изделиям и логотип или
      текст, который нужно нанести.
    answerUz: >-
      Taxminiy tiraj, sabab, byudjet, buyumlar bo‘yicha istaklar va
      tushiriladigan logo yoki matn kerak bo‘ladi.
  - questionRu: На каких материалах делаете гравировку?
    questionUz: Qaysi materiallarda gravyura qilasiz?
    answerRu: >-
      Чаще всего гравировку делают на металле, дереве, коже, стекле, акриле и
      отдельных видах пластика. Точный способ зависит от изделия и задачи.
    answerUz: >-
      Ko‘pincha metall, yog‘och, charm, shisha, akril va ayrim plastik turlariga
      gravyura qilinadi. Aniq usul buyum va vazifaga bog‘liq.
  - questionRu: Можно ли увидеть результат до производства?
    questionUz: Ishlab chiqarishdan oldin natijani ko'rish mumkinmi?
    answerRu: >-
      Да. Перед запуском мы готовим макет и показываем, как логотип, имя, дата
      или надпись будут выглядеть на изделии.
    answerUz: >-
      Ha. Ish boshlanishidan oldin maket tayyorlaymiz va logo, ism, sana yoki
      yozuv buyumda qanday ko‘rinishini ko‘rsatamiz.
  - questionRu: Предоставляете ли подарочную упаковку?
    questionUz: Sovg'a qadoqlash taqdim etasizmi?
    answerRu: >-
      Да. Можно подобрать подарочную коробку, упаковку, открытку или другой
      формат подачи под стиль компании и повод.
    answerUz: >-
      Ha. Kompaniya uslubi va sababiga mos sovg‘a qutisi, qadoqlash, tabrik
      kartasi yoki boshqa taqdimot formatini tanlash mumkin.
