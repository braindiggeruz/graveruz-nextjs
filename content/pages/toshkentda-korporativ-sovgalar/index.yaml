  - discriminant: richText
    value: {}
  - discriminant: imageText
    value:
      image: /images/pages/toshkentda-korporativ-sovgalar/blocks/3/value/image.png
      imageSide: right
      title: Logotipli va shaxsiy gravyurali sovg‘alar
      body: >-
        Korporativ sovg‘a brend va inson bilan bog‘langanda kuchliroq ishlaydi.
        Buyumga kompaniya logotipi, xodim ismi, lavozim, sana, qisqa tilak yoki
        firma uslubi elementini tushirish mumkin.


        Bunday format welcome pack, hamkorlar uchun sovg‘alar, mijozlar uchun
        suvenirlar, rahbarlar uchun sovg‘alar va tadbirlar uchun to‘plamlarga
        mos keladi. Gravyura buyumni yanada chiroyli, nufuzli va esda qolarli
        qiladi.


        Graver Studio’da vazifaga mos buyumni tanlash mumkin: zajigalka, ruchka,
        bloknot, powerbank, soat yoki sovg‘a to‘plami. Narx buyum, tiraj,
        gravyura murakkabligi va maket tayyorlashga bog‘liq.
  - discriminant: richText
    value: {}
  - discriminant: faq
    value:
      title: Ko‘p beriladigan savollar
      items:
        - q: Qanday korporativ sovg‘alar buyurtma qilish mumkin?
          a: >-
            Zajigalkalar, ruchkalar, bloknotlar, kundaliklar, powerbank, soatlar
            va sovg‘a to‘plamlariga buyurtma berish mumkin. Mos variant sovg‘a
            sababi, auditoriya, brend uslubi va buyurtma formatiga bog‘liq.
        - q: Kompaniya logotipini tushirish mumkinmi?
          a: >-
            Ha, buyumga kompaniya logotipi, oluvchining ismi, sana, lavozim,
            qisqa ibora yoki firma uslubi elementini tushirish mumkin. Logotipni
            yaxshi sifatda yoki vektor formatda yuborgan ma’qul.
        - q: Bunday sovg‘alar xodimlar uchun mosmi?
          a: >-
            Ha, gravyurali korporativ sovg‘alar xodimlar, welcome pack, ichki
            tadbirlar, kasbiy bayramlar va jamoa ichidagi tabriklar uchun mos
            keladi.
        - q: Gravyurali korporativ sovg‘alar narxi qancha?
          a: >-
            Narx buyum, miqdor, gravyura murakkabligi va maket tayyorlashga
            bog‘liq. Aniq hisob-kitob uchun vazifa tavsifi va kerakli buyumlarni
            yuborish kerak.
        - q: Sovg‘alarni yagona brend uslubida tayyorlash mumkinmi?
          a: >-
            Ha, sovg‘alarni kompaniya uslubida tayyorlash mumkin: logotip, firma
            elementi, bir xil gravyura kompozitsiyasi va umumiy vizual ko‘rinish
            bilan.
  - discriminant: cta
    value:
      title: Korporativ sovg‘alar kerakmi?
      subtitle: >-
        Sovg‘alar kim uchun tayyorlanishini va ularga nima tushirish kerakligini
        yozing. Biz mos buyumlarni tavsiya qilamiz va buyurtmani hisoblab
        beramiz.
      buttonLabel: Sovg‘a tanlash
      buttonHref: https://t.me/GraverAdm
