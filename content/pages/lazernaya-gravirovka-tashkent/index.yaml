  - discriminant: richText
    value: {}
  - discriminant: imageText
    value:
      image: /images/pages/lazernaya-gravirovka-tashkent/blocks/3/value/image.jpg
      imageSide: right
      title: Корпоративная гравировка для подарков и бизнес-сувениров
      body: >-
        Лазерная гравировка помогает превратить обычный подарок в персональный
        бизнес-аксессуар. На изделие можно нанести логотип компании, имя
        получателя, дату, короткую фразу или элемент фирменного стиля.


        Такой формат хорошо подходит для корпоративных подарков, welcome pack,
        сувениров с логотипом, подарков сотрудникам, клиентам, партнёрам и
        руководителям. Гравировка делает изделие более аккуратным, статусным и
        запоминающимся.


        В Graver Studio можно подобрать подарок под задачу: зажигалку, ручку,
        блокнот, powerbank, часы или подарочный набор. Если вы не знаете, что
        выбрать, мы подскажем подходящий вариант под повод, стиль и формат
        заказа.
  - discriminant: richText
    value: {}
  - discriminant: faq
    value:
      title: Часто задаваемые вопросы
      items:
        - q: Что можно нанести с помощью лазерной гравировки?
          a: >-
            Можно нанести имя, инициалы, логотип компании, дату, короткую фразу,
            символ или элемент фирменного стиля. Итоговый вариант зависит от
            изделия и площади нанесения.
        - q: Можно ли заказать гравировку на корпоративных подарках?
          a: >-
            Да, лазерная гравировка подходит для корпоративных подарков, welcome
            pack, сувениров с логотипом, подарков сотрудникам, клиентам и
            партнёрам.
        - q: Сколько стоит лазерная гравировка в Ташкенте?
          a: >-
            Стоимость зависит от изделия, тиража, сложности нанесения и
            подготовки макета. Для точного расчёта лучше отправить описание
            задачи и желаемое изделие.
        - q: Можно ли нанести логотип компании?
          a: >-
            Да, можно нанести логотип компании. Лучше всего отправить логотип в
            хорошем качестве или в векторном формате, чтобы гравировка
            получилась аккуратной.
        - q: Какие подарки чаще всего заказывают с гравировкой?
          a: >-
            Чаще всего заказывают зажигалки, ручки, блокноты, ежедневники,
            powerbank, часы и подарочные наборы для сотрудников или партнёров.
  - discriminant: cta
    value:
      title: Хотите заказать гравировку?
      subtitle: >-
        Напишите нам, что нужно нанести и на какое изделие. Мы подскажем
        подходящий вариант и рассчитаем заказ.
      buttonLabel: Получить расчёт
      buttonHref: https://t.me/GraverAdm
