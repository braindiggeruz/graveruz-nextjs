h1: Премиальный подарочный набор с часами и логотипом компании
intro: >-
  Часы SLIM, кожаное портмоне и ручка-роллер в фирменном футляре. Нанесём
  логотип, эмблему, имя или короткую фразу — для партнёров, сотрудников и
  VIP-клиентов.
blocks:
  - discriminant: cta
    value:
      title: Хотите такой набор с логотипом вашей компании?
      subtitle: >-
        Напишите нам — подскажем варианты нанесения, упаковки и рассчитаем заказ
        под вашу задачу.
      buttonLabel: Рассчитать стоимость в Telegram
      buttonHref: https://t.me/GraverAdm
  - discriminant: faq
    value:
      title: Частые вопросы
      items:
        - q: Можно ли нанести логотип компании?
          a: >-
            Да, можно нанести логотип, эмблему, имя, дату или короткую фразу.
            Перед запуском готовим макет.
        - q: Подойдёт ли набор для корпоративных подарков?
          a: >-
            Да, набор подходит для партнёров, сотрудников, руководителей,
            VIP-клиентов и welcome pack.
        - q: Можно ли заказать несколько наборов для компании?
          a: >-
            Да, страница рассчитана на корпоративные заявки. Количество и детали
            лучше уточнить перед расчётом.
        - q: Можно ли выбрать цвет ремешка часов?
          a: >-
            Да, ремешок из натуральной телячьей кожи, цвет можно согласовать
            перед заказом.
        - q: Как рассчитать стоимость?
          a: >-
            Стоимость зависит от количества, состава, нанесения и упаковки.
            Оставьте заявку — мы рассчитаем вариант под вашу задачу.
