      title: Sovg‘alar va biznes suvenirlar uchun korporativ gravyura
      body: >-
        Lazer gravyura oddiy sovg‘ani shaxsiy biznes aksessuariga aylantirishga
        yordam beradi. Buyumga kompaniya logotipi, oluvchining ismi, sana, qisqa
        ibora yoki firma uslubi elementini tushirish mumkin.


        Bunday format korporativ sovg‘alar, welcome pack, logotipli suvenirlar,
        xodimlar, mijozlar, hamkorlar va rahbarlar uchun sovg‘alarga mos keladi.
        Gravyura buyumni yanada nafis, nufuzli va esda qolarli qiladi.


        Graver Studio’da vazifaga mos sovg‘ani tanlash mumkin: zajigalka,
        ruchka, bloknot, powerbank, soat yoki sovg‘a to‘plami. Agar nima
        tanlashni bilmasangiz, biz holat, uslub va buyurtma formatiga mos
        variantni tavsiya qilamiz.
  - discriminant: richText
    value: {}
  - discriminant: faq
    value:
      title: Ko‘p beriladigan savollar
      items:
        - q: Lazer gravyura yordamida nimalarni tushirish mumkin?
          a: >-
            Ism, bosh harflar, kompaniya logotipi, sana, qisqa ibora, belgi yoki
            firma uslubi elementini tushirish mumkin. Yakuniy variant buyum va
            tushirish maydoniga bog‘liq.
        - q: Korporativ sovg‘alarga gravyura buyurtma qilish mumkinmi?
          a: >-
            Ha, lazer gravyura korporativ sovg‘alar, welcome pack, logotipli
            suvenirlar, xodimlar, mijozlar va hamkorlar uchun sovg‘alarga mos
            keladi.
        - q: Toshkentda lazer gravyura narxi qancha?
          a: >-
            Narx buyum, tiraj, tushirish murakkabligi va maket tayyorlashga
            bog‘liq. Aniq hisob-kitob uchun vazifa tavsifi va kerakli buyumni
            yuborish yaxshi.
        - q: Kompaniya logotipini tushirish mumkinmi?
          a: >-
            Ha, kompaniya logotipini tushirish mumkin. Gravyura chiroyli
            chiqishi uchun logotipni yaxshi sifatda yoki vektor formatda
            yuborgan ma’qul.
        - q: Gravyura bilan qaysi sovg‘alar ko‘p buyurtma qilinadi?
          a: >-
            Ko‘pincha zajigalkalar, ruchkalar, bloknotlar, kundaliklar,
            powerbank, soatlar va xodimlar yoki hamkorlar uchun sovg‘a
            to‘plamlari buyurtma qilinadi.
  - discriminant: cta
    value:
      title: Gravyura buyurtma qilmoqchimisiz?
      subtitle: >-
        Nima tushirish kerakligini va qaysi buyumga gravyura qilmoqchi
        ekaningizni yozing. Biz mos variantni tavsiya qilamiz va buyurtmani
        hisoblab beramiz.
