          description: >-
            Можно нанести логотип компании, имя получателя, дату, должность,
            слоган или элемент фирменного стиля.
        - icon: check
          title: Премиальный внешний вид
          description: >-
            Персонализация делает подарок более статусным, аккуратным и ценным
            для получателя.
        - icon: check
          title: Подбор изделий
          description: >-
            Если вы не знаете, что выбрать, подскажем варианты под повод,
            аудиторию, стиль и формат заказа.
        - icon: check
          title: Для малых и крупных заказов
          description: >-
            Работаем с личными подарками, небольшими партиями и корпоративными
            наборами для бизнеса.
        - icon: check
          title: Для компаний в Ташкенте
          description: >-
            Помогаем бизнесу в Ташкенте и Узбекистане оформлять подарки в едином
