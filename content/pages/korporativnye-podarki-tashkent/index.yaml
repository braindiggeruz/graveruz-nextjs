  - discriminant: richText
    value: {}
  - discriminant: imageText
    value:
      image: /images/pages/korporativnye-podarki-tashkent/blocks/3/value/image.png
      imageSide: right
      title: Подарки с логотипом и персональной гравировкой
      body: >-
        Корпоративный подарок становится сильнее, когда он связан с брендом и
        человеком. На изделие можно нанести логотип компании, имя сотрудника,
        должность, дату, короткое пожелание или символичный элемент фирменного
        стиля.


        Такой формат подходит для welcome pack, подарков партнёрам, клиентских
        сувениров, подарков руководителям и наборов для мероприятий. Гравировка
        делает предмет более аккуратным, статусным и запоминающимся.


        В Graver Studio можно подобрать изделие под задачу: зажигалку, ручку,
        блокнот, powerbank, часы или подарочный набор. Стоимость зависит от
        изделия, тиража, сложности нанесения и подготовки макета.
  - discriminant: richText
    value: {}
  - discriminant: faq
    value:
      title: Часто задаваемые вопросы
      items:
        - q: Какие корпоративные подарки можно заказать?
          a: >-
            Можно заказать зажигалки, ручки, блокноты, ежедневники, powerbank,
            часы и подарочные наборы. Подходящий вариант зависит от повода,
            аудитории, стиля бренда и формата заказа.
        - q: Можно ли нанести логотип компании?
          a: >-
            Да, на изделия можно нанести логотип компании, имя получателя, дату,
            должность, короткую фразу или элемент фирменного стиля. Лучше
            отправить логотип в хорошем качестве или в векторном формате.
        - q: Подходят ли такие подарки для сотрудников?
          a: >-
            Да, корпоративные подарки с гравировкой подходят для сотрудников,
            welcome pack, внутренних мероприятий, профессиональных праздников и
            поздравлений внутри команды.
        - q: Можно ли подготовить подарки для клиентов и партнёров?
          a: >-
            Да, гравированные подарки подходят для клиентов, партнёров, деловых
            встреч, презентаций, конференций и других бизнес-событий.
        - q: Сколько стоят корпоративные подарки с гравировкой?
          a: >-
            Стоимость зависит от изделия, количества, сложности нанесения и
            подготовки макета. Для точного расчёта лучше отправить описание
            задачи и желаемые изделия.
        - q: Можно ли заказать подарки в едином стиле бренда?
          a: >-
            Да, можно оформить подарки в едином стиле компании: с логотипом,
            фирменными элементами, одинаковой композицией нанесения и общим
            визуальным настроением.
  - discriminant: cta
    value:
      title: Нужны корпоративные подарки?
      subtitle: >-
        Напишите, для кого готовятся подарки и что нужно нанести. Мы подскажем
        подходящие изделия и рассчитаем заказ.
      buttonLabel: Получить подборку
      buttonHref: https://t.me/GraverAdm
