faq:
  - qRu: "Какой минимальный тираж для зажигалок?"
    qUz: "Zajigalkalar uchun minimal tiraj qancha?"
    aRu: "От 1 штуки. Единичный подарок с гравировкой или корпоративные тиражи — делаем любой объём."
    aUz: "1 donadan. Gravyurali yagona sovg'a yoki korporativ tirajlar — istalgan hajmni tayyorlaymiz."
  - qRu: "Что можно гравировать на зажигалках?"
    qUz: "Zajigalkalarga nimani o'ymakorlik qilish mumkin?"
    aRu: "Логотипы, имена, даты, фразы, простые изображения. Пришлите макет — покажем результат на цифровом превью."
    aUz: "Logotiplar, ismlar, sanalar, iboralar, oddiy tasvirlar. Maketni yuboring — natijani raqamli previewda ko'rsatamiz."
  - qRu: "Входит ли подарочная упаковка?"
    qUz: "Sovg'a qadoqlash kiritilganmi?"
    aRu: "Базовая коробка входит. Премиум-упаковка с брендированием — по запросу."
    aUz: "Asosiy quti kiritilgan. Brendlash bilan premium qadoqlash — so'rov bo'yicha."
